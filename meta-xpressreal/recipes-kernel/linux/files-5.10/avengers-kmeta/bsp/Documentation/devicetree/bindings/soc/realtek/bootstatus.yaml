%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/realtek/bootstatus.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Realtek Bootstatus

properties:
  compatible:
    enum:
      - realtek,rtd1619-bootstatus
      - realtek,rtd1319-bootstatus
      - realtek,rtd1619b-bootstatus

  realtek,boot-type:
    $ref: /schemas/types.yaml#definitions/phandle-array
    description: |
      a syscon with offset to a boot-type register

  realtek,sw-cold-boot-count:
    $ref: /schemas/types.yaml#definitions/phandle-array
    description: |
      a syscon with offset to a sw-cold-boot-count register.

  realtek,reboot-reason:
    $ref: /schemas/types.yaml#/definitions/string
    description: |
      a string contains reboot reason.

required:
  - compatible

additionalProperties: false

examples:
  - |
    /* add a hwlock */
    bootstatus {
      compatible = "realtek,rtd1619b-bootstatus";
      realtek,boot-type = <&iso 0x678>;
      realtek,sw-cold-boot-count = <&iso 0x644>;
    };
