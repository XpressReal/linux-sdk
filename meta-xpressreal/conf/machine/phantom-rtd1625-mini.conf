#@TYPE: Machine
#@NAME: Realtek Kent based Phantom EVM board
#@DESCRIPTION: Machine configuration for the RTD1625 Phantom board for console only applications

#PREFERRED_VERSION_linux-yocto ?= "5.10%"
#PREFERRED_VERSION_linux-yocto ?= "6.12%"
MACHINE_FEATURES += "npu"
MACHINE_FEATURES += "tee"

# Not supported on Linux 5.10
MACHINE_FEATURES += "vendor-wifi"

include conf/machine/include/kent.inc
include conf/machine/include/nogui.inc

