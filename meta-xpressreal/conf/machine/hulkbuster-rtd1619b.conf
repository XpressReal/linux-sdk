#@TYPE: Machine
#@NAME: Realtek Stark based Hulkbuster EVM board
#@DESCRIPTION: Machine configuration for the RTD1619b Hulkbuster board

MACHINE_FEATURES := "drm mali v4l2"
MACHINE_FEATURES += "npu"
MACHINE_FEATURES += "vendor-bt"
MACHINE_FEATURES += "vendor-wifi"

include conf/machine/include/stark.inc

UBOOT_CONFIG = "rtd1619b_emmc"
UBOOT_CONFIG[rtd1619b_emmc] = "rtd1619b_hulkbuster_defconfig,,u-boot.itb"
IMAGE_BOOT_FILES:remove = "u-boot.bin-rtd1619b_spi"
