name: Build images

on:
  workflow_dispatch:

  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: [self-hosted, Linux]
    permissions:
      contents: write

    steps:
      - name: Install Yocto Build Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_SUSPEND: 1
        run: |
          # No TTY here: an interactive needrestart/debconf prompt or a held
          # dpkg lock would block until the 6h job timeout instead of failing.
          sudo -n true
          sudo -E apt-get update -o Acquire::Retries=3
          sudo -E apt-get install -y -o DPkg::Lock::Timeout=300 file gawk wget git diffstat unzip texinfo gcc build-essential chrpath socat cpio libacl1 locales python3 python3-pip python3-pexpect xz-utils debianutils iputils-ping python3-git python3-jinja2 libsdl1.2-dev python3-subunit zstd liblz4-tool

      - name: Config git ident name
        run: |
          git config --global user.name "XpressReal SDK Builder"
          git config --global user.email "builder@example.com"

      - name: 1. Checkout Poky from Yocto Project
        if: ${{ hashFiles('poky/LICENSE') == '' }}
        run: |
          echo "--- Cloning poky ---"
          git clone -b scarthgap https://git.yoctoproject.org/poky

      - name: 2. Checkout linux-sdk repo and move meta-xpressreal
        uses: actions/checkout@v4
        with:
          path: linux-sdk-temp

      - name: Move meta-xpressreal
        run: |
          rm -rf poky/meta-xpressreal
          mv linux-sdk-temp/meta-xpressreal poky/

      - name: 3. Download prebuilt rootfs
        if: ${{ hashFiles('poky/meta-xpressreal/recipes-xpressreal/prebuilt-rootfs/files/debian-rootfs.tar.xz') == '' }}
        run: |
          echo "--- Download prebuilt rootfs ---"
          export ROOTFS_DL_URL="https://github.com/XpressReal/linux-sdk/releases/download/prebuilt-rootfs-v2.7.1"
          export OUTPUT_DIR="./poky/meta-xpressreal/recipes-xpressreal/prebuilt-rootfs/files"
          # Every archive the layer references must be present: bitbake
          # checksums all SRC_URI entries at parse time, so a missing tarball
          # fails the build even for targets that never use it.
          for name in debian ubuntu rpios \
                      desktop-debian desktop-ubuntu desktop-rpios \
                      weston-debian weston-ubuntu \
                      gamepad-debian gamepad-ubuntu; do
            echo "Downloading ${name}-rootfs.tar.xz"
            wget -q -O "${OUTPUT_DIR}/${name}-rootfs.tar.xz" "${ROOTFS_DL_URL}/${name}-rootfs.tar.xz"
          done

      - name: 4. Clone and lock dependency layers into poky/
        working-directory: ./poky
        run: |
          set -e
          # Runs unconditionally: the runner workspace is persistent, so a
          # clone-time-only guard would leave stale commits in place forever.
          sync_layer() {
            dir="$1"; url="$2"; branch="$3"; commit="$4"
            if [ ! -d "$dir/.git" ]; then
              echo "--- Cloning $dir ---"
              git clone -b "$branch" "$url" "$dir"
            fi
            echo "--- Locking $dir to $commit ---"
            git -C "$dir" fetch --all --tags
            git -C "$dir" checkout "$commit"
          }

          echo "--- Locking poky to b56134ff90 ---"
          git fetch --all --tags
          git checkout b56134ff90

          sync_layer meta-openembedded   https://git.openembedded.org/meta-openembedded     scarthgap         fdd1894976
          sync_layer meta-qt5            https://github.com/meta-qt5/meta-qt5               scarthgap         eb82841826
          sync_layer meta-neural-network https://github.com/nnstreamer/meta-neural-network  scarthgap         c14458c94e
          sync_layer meta-browser        https://github.com/OSSystems/meta-browser          scarthgap         168d284276
          sync_layer meta-clang          https://github.com/kraj/meta-clang                 scarthgap-clang20 76596813cd
          sync_layer meta-lts-mixins     https://git.yoctoproject.org/meta-lts-mixins       scarthgap/rust    96deb45139

          echo "--- Final directory structure inside poky: ---"
          ls -l

      - name: Initialize Build Environment using TEMPLATECONF
        working-directory: ./poky
        run: |
          # oe-init-build-env never overwrites an existing conf, so drop the
          # previous run's copies to keep config in step with the tagged SDK.
          rm -f build/conf/local.conf build/conf/bblayers.conf
          TEMPLATECONF=meta-xpressreal/conf/templates/default/ source oe-init-build-env build
          echo "--- Generated bblayers.conf ---"
          cat conf/bblayers.conf
          echo "--- Generated local.conf ---"
          cat conf/local.conf

      - name: Cache Yocto Downloads and SSTATE
        uses: actions/cache@v4
        with:
          path: |
            poky/build/downloads
            poky/build/sstate-cache
          key: ${{ runner.os }}-yocto-scarthgap-${{ hashFiles('poky/build/conf/local.conf', 'poky/build/conf/bblayers.conf') }}
          restore-keys: |
            ${{ runner.os }}-yocto-scarthgap-

      - name: Run BitBake Build (core-image-minimal)
        working-directory: ./poky
        run: |
          source oe-init-build-env build
          bitbake core-image-minimal
          mkdir -p images
          cp ./tmp/deploy/images/xpressreal-rtd1619b/core-image-minimal-*.rootfs.wic.xz ./images/xpressreal-core-image-minimal.wic.xz

      - name: Run BitBake Build (debian image server)
        working-directory: ./poky
        run: |
          source oe-init-build-env build
          bitbake debian-image
          cp ./tmp/deploy/images/xpressreal-rtd1619b/debian-image-*.rootfs.wic.xz ./images/xpressreal-debian-image-server.wic.xz

      - name: Run BitBake Build (ubuntu image server)
        working-directory: ./poky
        run: |
          source oe-init-build-env build
          echo 'OVERRIDES:append = ":ubuntu"' > temp-config.conf
          bitbake --postread=temp-config.conf debian-image
          cp ./tmp/deploy/images/xpressreal-rtd1619b/debian-image-*.rootfs.wic.xz ./images/xpressreal-ubuntu-image-server.wic.xz

      - name: Run BitBake Build (debian image desktop)
        working-directory: ./poky
        run: |
          source oe-init-build-env build
          echo 'MACHINE_FEATURES:append = " panfrost hifi xdesktop"' > temp-config.conf
          bitbake --postread=temp-config.conf debian-image
          cp ./tmp/deploy/images/xpressreal-rtd1619b/debian-image-*.rootfs.wic.xz ./images/xpressreal-debian-image-desktop.wic.xz

      - name: Run BitBake Build (ubuntu image desktop)
        working-directory: ./poky
        run: |
          source oe-init-build-env build
          echo 'MACHINE_FEATURES:append = " panfrost hifi xdesktop"' > temp-config.conf
          echo 'OVERRIDES:append = ":ubuntu"' >> temp-config.conf
          bitbake --postread=temp-config.conf debian-image
          cp ./tmp/deploy/images/xpressreal-rtd1619b/debian-image-*.rootfs.wic.xz ./images/xpressreal-ubuntu-image-desktop.wic.xz

      - name: Create Release and Upload Artifacts
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            poky/build/images/xpressreal-core-image-minimal.wic.xz
            poky/build/images/xpressreal-debian-image-server.wic.xz
            poky/build/images/xpressreal-ubuntu-image-server.wic.xz
            poky/build/images/xpressreal-debian-image-desktop.wic.xz
            poky/build/images/xpressreal-ubuntu-image-desktop.wic.xz
